
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin | Olympus Legacy Club</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="admin.js" defer></script>
</head>
<body>
  <main class="container">
    <header class="header">
      <div class="logo">OLP</div>
      <div>
        <h1>OLYMPUS <span>LEGACY</span></h1>
        <p>ADMIN DASHBOARD</p>
      </div>
    </header>

    <section class="card" id="loginPanel">
      <div class="status">● ADMINISTRATOR</div>
      <h2>Login Admin</h2>

      <form id="loginForm">
        <label>Email Admin</label>
        <input id="email" type="email" required>

        <label>Password</label>
        <input id="password" type="password" required>

        <button id="loginBtn" type="submit">LOGIN ADMIN</button>
        <p id="loginMessage"></p>
      </form>
    </section>

    <section class="card" id="dashboard" hidden>
      <div class="status">● DASHBOARD ADMIN</div>
      <h2>Data Kehadiran</h2>

      <button id="logoutBtn" type="button">LOGOUT</button>

      <label>Pilih Tanggal</label>
      <input type="date" id="dateFilter">

      <button id="loadBtn" type="button">TAMPILKAN DATA</button>

      <div class="date-box">
        <p>Total: <strong id="total">0</strong></p>
        <p>Hadir: <strong id="hadir poin diatas 600">0</strong></p>
        <p>Hadir: <strong id="hadir poin dibawah 600">0</strong></p>
      </div>

      <button id="exportBtn" type="button">EKSPOR CSV</button>
      <p id="tableMessage"></p>

      <div style="overflow-x:auto; margin-top:20px">
        <table border="1" cellpadding="10" width="100%">
          <thead>
            <tr>
              <th>Nama</th>
              <th>Status</th>
              <th>Keterangan</th>
              <th>Waktu</th>
              <th>Aksi</th>
            </tr>
          </thead>
          <tbody id="attendanceTable"></tbody>
        </table>
      </div>
    </section>

    <footer>
      <a href="index.html">Kembali ke Absensi</a>
      <p>© 2026 Olympus Legacy Club</p>
    </footer>
  </main>
</body>
</html>
